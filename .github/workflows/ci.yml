name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spht
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GITHUB_ID: ci-github-client
      GITHUB_SECRET: ci-github-secret
      GITHUB_ACCESS_TOKEN: ci-github-token
      STRIPE_API_KEY: sk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint without warnings
        run: pnpm lint

      - name: Production build
        run: pnpm build

  # BEGIN TEMP ALIGNMENT JOB
  migrate_alignment:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/align-web-admin-stack' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spht
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GITHUB_ID: ci-github-client
      GITHUB_SECRET: ci-github-secret
      GITHUB_ACCESS_TOKEN: ci-github-token
      STRIPE_API_KEY: sk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/align-web-admin-stack
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Apply, verify, and commit migration
        shell: bash
        run: |
          set +e
          rm -f /tmp/web-align.log .web-align-failure.log

          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/align-web-stack.mjs')
          text = path.read_text()
          text = text.replace('"packages/biome-config/biome.json"', '"packages/biome-config/base.json"')
          text = text.replace('files: ["biome.json"]', 'files: ["base.json"]')
          text = text.replace('./packages/biome-config/biome.json', './packages/biome-config/base.json')
          text = text.replace(
              '  files: {\n    ignoreUnknown: true,',
              '  css: { parser: { tailwindDirectives: true } },\n  files: {\n    ignoreUnknown: true,',
          )
          path.write_text(text)
          PY

          run_step() {
            echo "== $1 ==" | tee -a /tmp/web-align.log
            shift
            "$@" 2>&1 | tee -a /tmp/web-align.log
            return ${PIPESTATUS[0]}
          }

          status=0
          run_step "Apply deterministic migration" node scripts/align-web-stack.mjs || status=$?

          if [ "$status" -eq 0 ]; then
            python -c "from pathlib import Path; p=Path('apps/web/app/(dashboard)/dashboard/page.tsx'); t=p.read_text(); t=t.replace('quotes.map((quote, index) => (', 'quotes.map((quote) => (').replace('key={index}', 'key={String(quote)}'); p.write_text(t)"
          fi

          if [ "$status" -eq 0 ]; then run_step "Resolve upgraded workspace" pnpm install --no-frozen-lockfile || status=$?; fi
          if [ "$status" -eq 0 ]; then run_step "Generate Prisma Client" pnpm prisma:generate || status=$?; fi
          if [ "$status" -eq 0 ]; then run_step "Apply safe Biome fixes" pnpm check:fix || status=$?; fi
          if [ "$status" -eq 0 ]; then run_step "Type check" pnpm typecheck || status=$?; fi
          if [ "$status" -eq 0 ]; then run_step "Biome check" pnpm check || status=$?; fi
          if [ "$status" -eq 0 ]; then run_step "Supplementary ESLint" pnpm lint || status=$?; fi
          if [ "$status" -eq 0 ]; then run_step "Production build" pnpm build || status=$?; fi

          if [ "$status" -eq 0 ]; then
            {
              echo '== Safety assertions =='
              grep -F 'provider = "postgresql"' apps/web/prisma/schema.prisma
              grep -F 'next-auth' apps/web/package.json
              grep -F 'stripe' apps/web/package.json
              test -d apps/web/app/api
              test -d packages/ui/src/magicui
              test ! -f apps/web/tailwind.config.ts
              grep -F '@source "../../../packages/ui/src' apps/web/app/globals.css
              grep -F 'reactCompiler: true' apps/web/next.config.js
              ! grep -R '@spht/tsconfig' apps packages --include='package.json' --include='tsconfig.json'
            } 2>&1 | tee -a /tmp/web-align.log
            status=${PIPESTATUS[0]}
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/web-align.log .web-align-failure.log
            git add .web-align-failure.log
            git commit -m "ci: record Web alignment migration failure"
            git push origin HEAD:feat/align-web-admin-stack
            exit "$status"
          fi

          git checkout HEAD -- .github/workflows/ci.yml
          git checkout HEAD -- .github/workflows/web-align-apply.yml
          git checkout HEAD -- .github/workflows/web-align-baseline.yml

          rm -f scripts/align-web-stack.mjs
          rm -f .baseline-trigger
          rm -f .web-align-failure.log
          rm -f docs/superpowers/plans/.branch-marker
          rm -f docs/superpowers/plans/.do-not-use
          rm -f docs/superpowers/plans/.last-marker
          rm -f docs/superpowers/plans/.oops
          rmdir scripts 2>/dev/null || true

          git add -A
          git commit -m "refactor: align Web engineering stack with Admin"
          git push origin HEAD:feat/align-web-admin-stack
  # END TEMP ALIGNMENT JOB
