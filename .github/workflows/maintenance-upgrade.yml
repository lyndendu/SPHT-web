name: Apply Maintenance Upgrades

on:
  push:
    branches:
      - automation/maintenance-warnings
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'automation/maintenance-warnings')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spht
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GITHUB_ID: ci-github-client
      GITHUB_SECRET: ci-github-secret
      GITHUB_ACCESS_TOKEN: ci-github-token
      STRIPE_API_KEY: sk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v6
        with:
          ref: automation/maintenance-warnings
          fetch-depth: 0

      - name: Align pnpm version declaration
        run: npm pkg set packageManager=pnpm@11.7.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply source and configuration fixes
        run: |
          python scripts/resolve-maintenance-warnings.py
          python scripts/modern-stack-compat.py
          python scripts/app-stack-compat.py
          python scripts/eslint-esm-compat.py
          python scripts/pnpm-build-policy.py

      - name: Upgrade framework, auth and UI dependencies
        run: |
          pnpm --filter @spht/web remove next-headers @next-auth/prisma-adapter radix-ui
          pnpm --filter @spht/web add next@latest react@latest react-dom@latest next-auth@beta @auth/prisma-adapter@latest recharts@latest
          pnpm --filter @spht/web add @radix-ui/react-avatar@latest @radix-ui/react-dialog@latest @radix-ui/react-dropdown-menu@latest @radix-ui/react-icons@latest @radix-ui/react-label@latest @radix-ui/react-navigation-menu@latest @radix-ui/react-scroll-area@latest @radix-ui/react-slot@latest @radix-ui/react-toast@latest framer-motion@latest lucide-react@latest next-themes@latest vaul@latest
          pnpm --filter @spht/web add -D eslint@^9.0.0 eslint-config-next@latest typescript@~5.9.0 @types/node@latest @types/react@latest @types/react-dom@latest
          pnpm --filter @spht/eslint-config remove @typescript-eslint/parser
          pnpm --filter @spht/eslint-config add @eslint/js@^9.0.0 eslint-config-next@latest typescript-eslint@latest
          pnpm --filter @spht/eslint-config add -D eslint@^9.0.0 typescript@~5.9.0
          pnpm --filter @spht/ui add @radix-ui/react-avatar@latest @radix-ui/react-dialog@latest @radix-ui/react-dropdown-menu@latest @radix-ui/react-icons@latest @radix-ui/react-label@latest @radix-ui/react-navigation-menu@latest @radix-ui/react-scroll-area@latest @radix-ui/react-slot@latest @radix-ui/react-toast@latest framer-motion@latest lucide-react@latest vaul@latest
          pnpm --filter @spht/ui add -D eslint@^9.0.0 typescript@~5.9.0 @types/node@latest @types/react@latest @types/react-dom@latest react@latest react-dom@latest
          pnpm --filter @spht/contracts add -D eslint@^9.0.0 typescript@~5.9.0 @types/node@latest
          pnpm --filter @spht/utils add -D eslint@^9.0.0 typescript@~5.9.0 @types/node@latest
          pnpm update -r caniuse-lite@latest browserslist@latest
          pnpm dedupe

      - name: Type check
        run: pnpm typecheck

      - name: Lint without warnings
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Commit verified maintenance fixes
        run: |
          rm scripts/resolve-maintenance-warnings.py scripts/modern-stack-compat.py scripts/app-stack-compat.py scripts/eslint-esm-compat.py scripts/pnpm-build-policy.py
          rm -f .maintenance-trigger
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: resolve maintenance warnings"
          git push origin HEAD:automation/maintenance-warnings
