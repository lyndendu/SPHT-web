name: Repository Snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
