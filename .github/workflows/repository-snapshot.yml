name: Apply Monorepo Migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'automation/repository-snapshot'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spht
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GITHUB_ID: ci-github-client
      GITHUB_SECRET: ci-github-secret
      GITHUB_ACCESS_TOKEN: ci-github-token
      STRIPE_API_KEY: sk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply directory migration
        run: python scripts/migrate-to-monorepo.py

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Remove temporary migration files
        run: |
          rm scripts/migrate-to-monorepo.py
          rm .github/workflows/repository-snapshot.yml
          rmdir scripts 2>/dev/null || true

      - name: Commit migration to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: convert repository to monorepo"
          git push origin HEAD:main
